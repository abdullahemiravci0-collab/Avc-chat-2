<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>🏹 Avcı Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: system-ui, sans-serif; }
  body { background: #0a0e11; color: #e9edef; height: 100vh; overflow: hidden; }

  .login { display: flex; flex-direction: column; gap: 12px; max-width: 320px; margin: 20vh auto; padding: 20px; text-align: center; }
  .login h1 { font-size: 28px; margin-bottom: 5px; letter-spacing: 1px; }
  .login p { color: #8696a0; font-size: 14px; margin-bottom: 15px; }
  .login input, .login button { padding: 14px; border-radius: 10px; border: none; font-size: 15px; }
  .login input { background: #202c33; color: white; }
  .login button { background: #00a884; color: white; cursor: pointer; font-weight: bold; }

  .app { display: none; height: 100vh; }
  .app.active { display: flex; }

  #sidebar { width: 240px; background: #111b21; display: flex; flex-direction: column; border-right: 1px solid #202c33; }
  #sidebar h3 { padding: 15px; background: #202c33; font-size: 13px; letter-spacing: 1px; color: #8696a0; text-transform: uppercase; }
  #userList { list-style: none; overflow-y: auto; flex: 1; padding: 0; }
  #userList li { padding: 15px; cursor: pointer; border-bottom: 1px solid #202c33; font-weight: 500; }
  #userList li:hover, #userList li.active { background: #2a3942; }
  #userList li .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #00a884; margin-right: 8px; }

  #chatArea { flex: 1; display: flex; flex-direction: column; background: #0b141a; }
  #chatHeader { padding: 12px 15px; background: #202c33; display: flex; align-items: center; gap: 10px; }
  #chatHeader .name { flex: 1; font-weight: bold; font-size: 16px; }
  #chatHeader button { background: #2a3942; border: none; color: white; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 18px; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; }

  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  #empty { color: #8696a0; text-align: center; margin: auto; font-size: 14px; }

  .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; word-wrap: break-word; font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .msg.in { background: #202c33; align-self: flex-start; border-top-left-radius: 2px; }
  .msg.out { background: #005c4b; align-self: flex-end; border-top-right-radius: 2px; }
  .msg .time { font-size: 11px; color: #8696a0; display: block; text-align: right; margin-top: 4px; }

  #inputBar { display: flex; padding: 12px; gap: 10px; background: #202c33; }
  #inputBar input { flex: 1; padding: 14px; border-radius: 20px; border: none; font-size: 15px; background: #2a3942; color: white; }
  #inputBar button { padding: 0 20px; border-radius: 20px; border: none; background: #00a884; color: white; cursor: pointer; font-weight: bold; }
  #inputBar button:disabled { opacity: 0.5; cursor: not-allowed; }

  #callOverlay { position: fixed; inset: 0; background: #0a0e11; z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
  #callOverlay.active { display: flex; }
  #remoteVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #localVideo { position: absolute; top: 20px; right: 20px; width: 110px; height: 150px; object-fit: cover; border-radius: 12px; border: 2px solid #00a884; background: #000; z-index: 2; }
  #callStatus { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 12px 24px; border-radius: 25px; font-size: 16px; z-index: 3; text-align: center; width: 80%; font-weight: bold; }
  #callControls { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 3; }
  #callControls button { width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 28px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  
  .btn-accept { background: #00a884; }
  .btn-reject { background: #e63946; }
  .btn-mute { background: #2a3942; }
  .btn-mute.muted { background: #e63946; }

  @media (max-width: 600px) {
    #sidebar { width: 85px; }
    #sidebar h3 { font-size: 10px; padding: 15px 5px; text-align: center; }
    #userList li { padding: 12px 5px; font-size: 11px; text-align: center; }
    #userList li .dot { display: block; margin: 0 auto 5px; }
  }
</style>
</head>
<body>

<div class="login" id="loginScreen">
  <h1>🏹 Avcı Chat</h1>
  <p>Hedefini seç, avlanmaya başla!</p>
  <input id="username" placeholder="Kullanıcı adın" maxlength="15" />
  <button onclick="login()">Avcı Chat'e Gir</button>
</div>

<div class="app" id="appScreen">
  <aside id="sidebar">
    <h3>🎯 Avcılar</h3>
    <ul id="userList"></ul>
  </aside>
  <main id="chatArea">
    <div id="chatHeader">
      <div class="name" id="chatName">Bir avcı seç</div>
      <button id="audioCallBtn" disabled title="Sesli Ara">📞</button>
      <button id="videoCallBtn" disabled title="Görüntülü Ara">📹</button>
    </div>
    <div id="messages"><div id="empty">Sohbet için soldan bir avcı seç</div></div>
    <div id="inputBar">
      <input id="msgInput" placeholder="Mesaj yaz..." disabled autocomplete="off" />
      <button id="sendBtn" disabled>Gönder</button>
    </div>
  </main>
</div>

<div id="callOverlay">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div id="callStatus">Aranıyor...</div>
  <div id="callControls"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myName = null;
let currentChat = null;
let allMessages = [];
const userSet = new Set();

function login() {
  const u = document.getElementById('username').value.trim();
  if (!u) return alert('Kullanıcı adı gir');
  myName = u;
  socket.emit('register', u);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appScreen').classList.add('active');
  localStorage.setItem('chat_user', u);
}
document.getElementById('username').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

socket.on('users', (list) => {
  userSet.clear();
  list.forEach(u => { if (u !== myName) userSet.add(u); });
  renderUsers();
});

function renderUsers() {
  const ul = document.getElementById('userList');
  ul.innerHTML = '';
  const others = [...userSet].sort();
  if (others.length === 0) {
    ul.innerHTML = '<li style="color:#8696a0;cursor:default;text-align:center;font-size:12px;padding:15px 5px">Avcı yok</li>';
    return;
  }
  others.forEach(u => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="dot"></span>${u}`;
    if (u === currentChat) li.classList.add('active');
    li.onclick = () => openChat(u);
    ul.appendChild(li);
  });
}

function openChat(user) {
  currentChat = user;
  document.getElementById('chatName').textContent = '🎯 ' + user;
  document.getElementById('msgInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('audioCallBtn').disabled = false;
  document.getElementById('videoCallBtn').disabled = false;
  document.getElementById('msgInput').focus();
  renderUsers();
  socket.emit('get history', { withUser: user }, (history) => {
    allMessages = history;
    renderMessages();
  });
}

function renderMessages() {
  const box = document.getElementById('messages');
  box.innerHTML = '';
  if (!currentChat) {
    box.innerHTML = '<div id="empty">Sohbet için soldan bir avcı seç</div>';
    return;
  }
  const filtered = allMessages.filter(
    m => (m.from === myName && m.to === currentChat) ||
         (m.from === currentChat && m.to === myName)
  );
  if (filtered.length === 0) {
    box.innerHTML = '<div id="empty">Henüz iz yok. İlk mesajı sen at! 🏹</div>';
    return;
  }
  filtered.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.from === myName ? 'out' : 'in');
    const t = new Date(m.time).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    div.innerHTML = `${escapeHtml(m.text)}<span class="time">${t}</span>`;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

socket.on('private message', (msg) => {
  if ((msg.from === currentChat && msg.to === myName) ||
      (msg.from === myName && msg.to === currentChat)) {
    allMessages.push(msg);
    renderMessages();
  }
});

function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChat) return;
  socket.emit('private message', { to: currentChat, text });
  input.value = '';
  input.focus();
}
document.getElementById('sendBtn').onclick = send;
document.getElementById('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

let peer = null;
let localStream = null;
let callType = 'audio';
let incomingFrom = null;
let pendingOffer = null;

const iceConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };

async function getMedia(type) {
  const constraints = type === 'video' ? { audio: true, video: { facingMode: 'user' } } : { audio: true, video: false };
  return await navigator.mediaDevices.getUserMedia(constraints);
}

function createPeer(to) {
  const p = new RTCPeerConnection(iceConfig);
  localStream.getTracks().forEach(t => p.addTrack(t, localStream));
  p.onicecandidate = (e) => { if (e.candidate) socket.emit('ice-candidate', { to, candidate: e.candidate }); };
  p.ontrack = (e) => { document.getElementById('remoteVideo').srcObject = e.streams[0]; };
  return p;
}

async function startCall(type) {
  if (!currentChat) return;
  callType = type;
  try {
    localStream = await getMedia(type);
    if (type === 'video') document.getElementById('localVideo').srcObject = localStream;
  } catch (err) {
    alert('Kamera/mikrofon izni gerekli: ' + err.message);
    return;
  }
  showCallUI(type === 'video');
  document.getElementById('callStatus').textContent = `📞 ${currentChat} aranıyor...`;
  document.getElementById('callControls').innerHTML = `<button class="btn-reject" onclick="cancelCall('${currentChat}')">✖</button>`;
  peer = createPeer(currentChat);
  const offer = await peer.createOffer();
  await peer.setLocalDescription(offer);
  socket.emit('call-user', { to: currentChat, offer, type });
}

socket.on('incoming-call', async ({ from, offer, type }) => {
  incomingFrom = from;
  callType = type;
  pendingOffer = offer;
  showCallUI(type === 'video');
  document.getElementById('callStatus').textContent = `📞 ${from} arıyor...`;
  document.getElementById('callControls').innerHTML = `
    <button class="btn-accept" onclick="acceptCall()">✔</button>
    <button class="btn-reject" onclick="rejectCall()">✖</button>
  `;
});

async function acceptCall() {
  try {
    localStream = await getMedia(callType);
    if (callType === 'video') document.getElementById('localVideo').srcObject = localStream;
  } catch (err) {
    alert('Kamera/mikrofon izni gerekli: ' + err.message);
    rejectCall();
    return;
  }
  peer = createPeer(incomingFrom);
  await peer.setRemoteDescription(new RTCSessionDescription(pendingOffer));
  const answer = await peer.createAnswer();
  await peer.setLocalDescription(answer);
  socket.emit('answer-call', { to: incomingFrom, answer });
  document.getElementById('callStatus').textContent = `🔊 ${incomingFrom} ile görüşülüyor`;
  showInCallControls();
}

socket.on('call-answered', async ({ answer }) => {
  await peer.setRemoteDescription(new RTCSessionDescription(answer));
  document.getElementById('callStatus').textContent = `🔊 ${currentChat} ile görüşülüyor`;
  showInCallControls();
});

socket.on('ice-candidate', async ({ candidate }) => {
  if (peer && candidate) { try { await peer.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {} }
});

function rejectCall() { socket.emit('reject-call', { to: incomingFrom }); cleanupCall(); }
function cancelCall(to) { socket.emit('end-call', { to }); cleanupCall(); }
socket.on('call-rejected', () => { alert('Arama reddedildi'); cleanupCall(); });
socket.on('call-ended', () => { cleanupCall(); });

function showInCallControls() {
  document.getElementById('callControls').innerHTML = `
    <button class="btn-mute" id="muteBtn" onclick="toggleMute()">🎤</button>
    <button class="btn-reject" onclick="endCall()">📴</button>
  `;
}

function toggleMute() {
  if (!localStream) return;
  const audioTrack = localStream.getAudioTracks()[0];
  if (!audioTrack) return;
  audioTrack.enabled = !audioTrack.enabled;
  const btn = document.getElementById('muteBtn');
  btn.classList.toggle('muted', !audioTrack.enabled);
  btn.textContent = audioTrack.enabled ? '🎤' : '🔇';
}

function endCall() { const other = incomingFrom || currentChat; socket.emit('end-call', { to: other }); cleanupCall(); }

function cleanupCall() {
  if (localStream) localStream.getTracks().forEach(t => t.stop());
  if (peer) { peer.close(); peer = null; }
  localStream = null; incomingFrom = null; pendingOffer = null;
  document.getElementById('callOverlay').classList.remove('active');
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;
}

function showCallUI(withVideo) {
  document.getElementById('callOverlay').classList.add('active');
  document.getElementById('localVideo').style.display = withVideo ? 'block' : 'none';
}

document.getElementById('audioCallBtn').onclick = () => startCall('audio');
document.getElementById('videoCallBtn').onclick = () => startCall('video');

const saved = localStorage.getItem('chat_user');
if (saved) document.getElementById('username').value = saved;
socket.on('connect', () => { if (myName) socket.emit('register', myName); });
</script>
</body>
</html>
